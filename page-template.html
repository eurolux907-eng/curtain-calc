───────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: "Segoe UI", Arial, sans-serif;

.sidebar {
  position: fixed;
  top: 0; left: 0;
  width: 240px;
  height: 100vh;
  background: #0F1A30;
  display: flex;
  flex-direction: column;
  padding: 28px 18px;
  z-index: 100;
  overflow-y: auto;
}

/* Внешняя золотая рамка */
.sidebar::before {
  content: "";
  position: fixed;
  top: 10px; left: 10px;
  width: 220px;
  height: calc(100vh - 20px);
  border: 1px solid rgba(196,149,42,0.45);
  pointer-events: none;
  z-index: 101;
}
/* Внутренняя рамка */
.sidebar::after {
  content: "";
  position: fixed;
  top: 16px; left: 16px;
  width: 208px;
  height: calc(100vh - 32px);
  border: 1px solid rgba(196,149,42,0.18);
  pointer-events: none;
  z-index: 101;
}

  align-items: center;

  z-index: 102;
}
.logo-cross {
  font-size: 22px;

.logo-name {

/* ═════════════════════════════════════════════════════
   МОБИЛЬНЫЙ СТАНДАРТ ВСПЛЫВАЮЩИХ ФОРМ
   Модалка занимает всю видимую высоту экрана: шапка сверху
   и кнопка отправки снизу закреплены, поля прокручиваются между ними.
   --modal-h / --modal-top задаёт JS по visualViewport: адресная
   строка браузера и экранная клавиатура меняют видимую область.
═════════════════════════════════════════════════════ */
@media (max-width: 768px) {
  .modal-overlay {
    inset: auto;
    left: 0;
    right: 0;
    top: var(--modal-top, 0px);
    height: 100vh;
    height: 100dvh;
    height: var(--modal-h, 100dvh);
    padding: 0;
    align-items: stretch;
    overflow: hidden;
  }

  .modal-box {
    width: 100%;
    max-width: none;
    height: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ШАПКА — заголовок и крестик, видны всегда */
  .modal-title {
    flex: 0 0 auto;
    margin: 0;
    padding: 20px 64px;
    font-size: 21px;
    line-height: 1.25;
    background: #FDF6E8;
    border-bottom: 1px solid rgba(196,149,42,0.30);
  }
  .modal-close {
    top: 9px;
    right: 9px;
    width: 48px;
    height: 48px;
    font-size: 24px;
    z-index: 3;
  }

  /* ТЕЛО — поля прокручиваются внутри модалки */
  .donate-form {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 20px 18px 0;
  }

  /* КНОПКА ОТПРАВКИ — закреплена снизу, видна при любой прокрутке.
     Остаётся внутри <form>, поэтому отправка не ломается.
     order держит кнопку последней, даже если в разметке за ней идёт сообщение. */
  .donate-form .btn-donate {
    position: sticky;
    bottom: 0;
    order: 1;
    z-index: 2;
    margin: 6px 0 0;
    box-shadow: 0 -10px 12px 10px #FDF6E8;
  }

  /* Запас снизу: последнее поле долистывается и не прячется под кнопкой */
  .donate-form::after {
    content: '';
    flex: 0 0 auto;
    height: 16px;
  }

  /* Экран благодарности (svyatyni) — тоже в прокручиваемой части */
  .svecha-thanks {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
  }
}
</style>
